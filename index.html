<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q_GAME · 小游戏大厅</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070d;
      --panel: rgba(8, 16, 28, 0.82);
      --cyan: #3cf6ff;
      --magenta: #ff3cad;
      --lime: #9dff6a;
      --amber: #ffc44d;
      --text: #d7f7ff;
      --muted: #6f8ea3;
      --line: rgba(60, 246, 255, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Share Tech Mono", ui-monospace, monospace;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .fx-grid,
    .fx-scan,
    .fx-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .fx-grid {
      background:
        radial-gradient(ellipse at 50% 0%, rgba(60, 246, 255, 0.1), transparent 42%),
        radial-gradient(ellipse at 85% 100%, rgba(255, 60, 173, 0.08), transparent 36%),
        linear-gradient(rgba(60, 246, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(60, 246, 255, 0.045) 1px, transparent 1px);
      background-size: auto, auto, 48px 48px, 48px 48px;
    }

    .fx-scan {
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.025) 0 1px,
        transparent 1px 4px
      );
      opacity: 0.28;
    }

    .fx-glow {
      background: radial-gradient(circle at 50% 40%, transparent 40%, rgba(0, 0, 0, 0.55) 100%);
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(92vw, 720px);
      margin: 0 auto;
      padding: clamp(28px, 6vh, 56px) 12px 48px;
      display: grid;
      gap: 28px;
    }

    .hero {
      display: grid;
      gap: 10px;
      padding: 8px 4px 4px;
    }

    .hero .tag {
      font-size: 11px;
      letter-spacing: 0.42em;
      color: var(--cyan);
      text-shadow: 0 0 12px rgba(60, 246, 255, 0.55);
    }

    .hero h1 {
      font-family: Orbitron, sans-serif;
      font-size: clamp(36px, 9vw, 56px);
      font-weight: 700;
      letter-spacing: 0.14em;
      line-height: 1;
      text-shadow: 0 0 28px rgba(60, 246, 255, 0.35);
    }

    .hero h1 span {
      color: var(--cyan);
    }

    .hero p {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.18em;
      max-width: 28em;
      line-height: 1.7;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 0 4px;
    }

    .section-head h2 {
      font-family: Orbitron, sans-serif;
      font-size: 13px;
      letter-spacing: 0.28em;
      color: var(--text);
    }

    .section-head span {
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--muted);
    }

    .catalog {
      display: grid;
      gap: 12px;
    }

    .game {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 16px;
      align-items: center;
      padding: 18px 20px;
      text-decoration: none;
      color: inherit;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45) inset;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .game:hover,
    .game:focus-visible {
      border-color: rgba(60, 246, 255, 0.55);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.45) inset,
        0 0 24px rgba(60, 246, 255, 0.12);
      transform: translateY(-1px);
      outline: none;
    }

    .game.soon {
      opacity: 0.55;
      cursor: default;
      pointer-events: none;
    }

    .game .meta {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .game .id {
      font-size: 10px;
      letter-spacing: 0.28em;
      color: var(--muted);
    }

    .game .name {
      font-family: Orbitron, sans-serif;
      font-size: clamp(16px, 3.5vw, 20px);
      letter-spacing: 0.12em;
    }

    .game .name em {
      font-style: normal;
      color: var(--cyan);
    }

    .game .tagline {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      line-height: 1.5;
    }

    .badge {
      font-size: 10px;
      letter-spacing: 0.22em;
      padding: 6px 10px;
      border: 1px solid;
      white-space: nowrap;
    }

    .badge.live {
      color: var(--lime);
      border-color: rgba(157, 255, 106, 0.45);
      box-shadow: 0 0 12px rgba(157, 255, 106, 0.15);
    }

    .badge.soon {
      color: var(--amber);
      border-color: rgba(255, 196, 77, 0.4);
    }

    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.14em;
    }

    .foot b {
      color: var(--magenta);
      font-weight: 400;
      border: 1px solid rgba(255, 60, 173, 0.45);
      padding: 4px 8px;
      letter-spacing: 0.2em;
    }
  </style>
</head>
<body>
  <div class="fx-grid"></div>
  <div class="fx-scan"></div>
  <div class="fx-glow"></div>

  <div class="shell">
    <header class="hero">
      <div class="tag">ARCADE // NODE</div>
      <h1>Q_<span>GAME</span></h1>
      <p>小游戏集合站。选一个进去玩，后面新作继续往这里挂。</p>
    </header>

    <div class="section-head">
      <h2>CATALOG</h2>
      <span id="count">0 GAMES</span>
    </div>

    <div class="catalog" id="catalog"></div>

    <footer class="foot">
      <span>ADD GAME → games/ + GAMES[]</span>
      <b>HUB</b>
    </footer>
  </div>

  <script>
    const GAMES = [
      {
        id: "01",
        name: "Q-SNAKE",
        accent: "SNAKE",
        tagline: "相位贪吃蛇 · 穿墙 · 闪电陷阱",
        href: "games/snake.html",
        status: "live",
      },
      {
        id: "02",
        name: "Q-STRIKE",
        accent: "STRIKE",
        tagline: "雷霆战机 · 自动开火 · 波次敌人",
        href: "games/fighter.html",
        status: "live",
      },
      {
        id: "03",
        name: "Q-BREACH",
        accent: "BREACH",
        tagline: "相位突袭 · 第一人称 · 走廊射击",
        href: "games/breach.html",
        status: "live",
      },
      {
        id: "04",
        name: "Q-DUEL",
        accent: "DUEL",
        tagline: "像素格斗 · 单人挑战 · 三局两胜",
        href: "games/duel.html",
        status: "live",
      },
      {
        id: "05",
        name: "COMING SOON",
        accent: "",
        tagline: "下一个小游戏位",
        href: "#",
        status: "soon",
      },
    ];

    const catalog = document.getElementById("catalog");
    const countEl = document.getElementById("count");
    const liveCount = GAMES.filter((g) => g.status === "live").length;

    countEl.textContent = liveCount + " LIVE / " + GAMES.length + " SLOTS";

    catalog.innerHTML = GAMES.map((game) => {
      const live = game.status === "live";
      const nameHtml = game.accent
        ? game.name.replace(game.accent, "<em>" + game.accent + "</em>")
        : game.name;
      const badge = live ? "LIVE" : "SOON";
      const tag = live
        ? `<a class="game" href="${game.href}">`
        : `<div class="game soon">`;
      const end = live ? "</a>" : "</div>";
      return (
        tag +
        `<div class="meta">` +
        `<div class="id">MODULE ${game.id}</div>` +
        `<div class="name">${nameHtml}</div>` +
        `<div class="tagline">${game.tagline}</div>` +
        `</div>` +
        `<div class="badge ${game.status}">${badge}</div>` +
        end
      );
    }).join("");
  </script>
</body>
</html>
