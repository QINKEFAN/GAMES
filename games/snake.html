<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Q-SNAKE · 相位贪吃蛇</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070d;
      --panel: rgba(8, 16, 28, 0.78);
      --cyan: #3cf6ff;
      --cyan-dim: #1498b8;
      --magenta: #ff3cad;
      --lime: #9dff6a;
      --amber: #ffc44d;
      --text: #d7f7ff;
      --muted: #6f8ea3;
      --line: rgba(60, 246, 255, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Share Tech Mono", ui-monospace, monospace;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .fx-grid,
    .fx-scan,
    .fx-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .fx-grid {
      background:
        radial-gradient(ellipse at 50% 0%, rgba(60, 246, 255, 0.08), transparent 42%),
        radial-gradient(ellipse at 80% 100%, rgba(255, 60, 173, 0.08), transparent 36%),
        linear-gradient(rgba(60, 246, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(60, 246, 255, 0.045) 1px, transparent 1px);
      background-size: auto, auto, 48px 48px, 48px 48px;
    }

    .fx-scan {
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.025) 0 1px,
        transparent 1px 4px
      );
      opacity: 0.28;
    }

    .fx-glow {
      background: radial-gradient(circle at 50% 50%, transparent 46%, rgba(0, 0, 0, 0.55) 100%);
    }

    .shell {
      width: min(92vw, 560px);
      display: grid;
      gap: 14px;
      padding: 12px;
      position: relative;
      z-index: 1;
    }

    .topbar,
    .footer,
    .stage {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.5) inset,
        0 0 20px rgba(60, 246, 255, 0.06);
      border-radius: 4px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px 12px;
    }

    .brand {
      display: grid;
      gap: 2px;
    }

    .brand .tag {
      font-size: 10px;
      letter-spacing: 0.38em;
      color: var(--cyan);
      text-shadow: 0 0 10px rgba(60, 246, 255, 0.7);
    }

    .brand h1 {
      font-family: Orbitron, sans-serif;
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 700;
      letter-spacing: 0.16em;
      line-height: 1.1;
    }

    .brand h1 span {
      color: var(--cyan);
      text-shadow: 0 0 18px rgba(60, 246, 255, 0.55);
    }

    .brand p {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.18em;
    }

    .meters {
      display: grid;
      grid-template-columns: repeat(2, auto);
      gap: 10px 16px;
    }

    .meter {
      min-width: 72px;
      text-align: right;
    }

    .meter span {
      display: block;
      font-size: 10px;
      letter-spacing: 0.28em;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .meter strong {
      font-family: Orbitron, sans-serif;
      font-size: 22px;
      color: var(--cyan);
      text-shadow: 0 0 12px rgba(60, 246, 255, 0.45);
    }

    .meter strong.pop {
      animation: score-pop 0.35s ease;
    }

    @keyframes score-pop {
      0% { transform: scale(1); color: var(--cyan); }
      40% { transform: scale(1.18); color: var(--lime); }
      100% { transform: scale(1); color: var(--cyan); }
    }

    .stage {
      position: relative;
      padding: 12px;
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      border: 2px solid var(--cyan);
      pointer-events: none;
      z-index: 3;
    }

    .stage::before {
      top: 8px;
      left: 8px;
      border-right: 0;
      border-bottom: 0;
    }

    .stage::after {
      right: 8px;
      bottom: 8px;
      border-left: 0;
      border-top: 0;
    }

    .hud-corners {
      position: absolute;
      inset: 8px;
      pointer-events: none;
      z-index: 3;
    }

    .hud-corners i:nth-child(1),
    .hud-corners i:nth-child(2) {
      position: absolute;
      width: 22px;
      height: 22px;
      border: 2px solid var(--magenta);
    }

    .hud-corners i:nth-child(1) {
      top: 0;
      right: 0;
      border-left: 0;
      border-bottom: 0;
    }

    .hud-corners i:nth-child(2) {
      left: 0;
      bottom: 0;
      border-right: 0;
      border-top: 0;
    }

    #game {
      display: block;
      width: 100%;
      height: auto;
      background: #061018;
      image-rendering: auto;
    }

    .overlay {
      position: absolute;
      inset: 12px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(180deg, rgba(5, 10, 18, 0.18), rgba(5, 10, 18, 0.72)),
        repeating-linear-gradient(
          to bottom,
          rgba(60, 246, 255, 0.05) 0 1px,
          transparent 1px 4px
        );
      transition: opacity 0.22s ease;
      z-index: 4;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .card {
      width: min(78%, 280px);
      text-align: center;
      padding: 8px;
    }

    .card .sys {
      color: var(--lime);
      font-size: 11px;
      letter-spacing: 0.32em;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(157, 255, 106, 0.5);
    }

    .card h2 {
      font-family: Orbitron, sans-serif;
      font-size: 28px;
      letter-spacing: 0.18em;
      margin-bottom: 8px;
      text-shadow: 0 0 18px rgba(60, 246, 255, 0.4);
    }

    .card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      margin-bottom: 22px;
    }

    .card p b {
      color: var(--amber);
      font-family: Orbitron, sans-serif;
    }

    #action {
      border: 1px solid var(--cyan);
      background: rgba(60, 246, 255, 0.08);
      color: var(--cyan);
      font-family: Orbitron, sans-serif;
      font-size: 13px;
      letter-spacing: 0.28em;
      padding: 11px 26px;
      cursor: pointer;
      border-radius: 2px;
      box-shadow: 0 0 14px rgba(60, 246, 255, 0.14);
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    #action:hover {
      background: var(--cyan);
      color: #041018;
      box-shadow: 0 0 24px rgba(60, 246, 255, 0.55);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.14em;
    }

    .badge {
      color: var(--magenta);
      border: 1px solid rgba(255, 60, 173, 0.55);
      padding: 4px 8px;
      letter-spacing: 0.2em;
      font-size: 10px;
      box-shadow: 0 0 12px rgba(255, 60, 173, 0.2);
    }

    .pad {
      display: none;
      grid-template-columns: 64px 64px 64px;
      grid-template-rows: 48px 48px 48px;
      gap: 8px;
      justify-content: center;
      user-select: none;
    }

    .pad button {
      border: 1px solid var(--line);
      background: rgba(8, 16, 28, 0.85);
      color: var(--cyan);
      font-family: Orbitron, sans-serif;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(60, 246, 255, 0.1);
    }

    .pad .up { grid-column: 2; grid-row: 1; }
    .pad .left { grid-column: 1; grid-row: 2; }
    .pad .pause { grid-column: 2; grid-row: 2; color: var(--amber); font-size: 11px; letter-spacing: 0.12em; }
    .pad .right { grid-column: 3; grid-row: 2; }
    .pad .down { grid-column: 2; grid-row: 3; }

    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 5;
      color: var(--muted);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.22em;
      padding: 8px 12px;
      border: 1px solid var(--line);
      background: rgba(8, 16, 28, 0.85);
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .back:hover {
      color: var(--cyan);
      border-color: rgba(60, 246, 255, 0.5);
    }

    @media (hover: none), (max-width: 720px) {
      .pad { display: grid; }
      body { overflow: auto; }
    }
  </style>
</head>
<body>
  <div class="fx-grid"></div>
  <div class="fx-scan"></div>
  <div class="fx-glow"></div>

  <a class="back" href="../index.html">← HUB</a>

  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="tag">Q_GAME // CORE</div>
        <h1>Q-<span>SNAKE</span></h1>
        <p>QUANTUM PHASE</p>
      </div>
      <div class="meters">
        <div class="meter">
          <span>SCORE</span>
          <strong id="score">00</strong>
        </div>
        <div class="meter">
          <span>BEST</span>
          <strong id="best">00</strong>
        </div>
        <div class="meter">
          <span>LEN</span>
          <strong id="len">03</strong>
        </div>
        <div class="meter">
          <span>SPD</span>
          <strong id="spd">01</strong>
        </div>
      </div>
    </header>

    <main class="stage">
      <div class="hud-corners"><i></i><i></i></div>
      <canvas id="game" width="480" height="480"></canvas>
      <div id="overlay" class="overlay">
        <div class="card">
          <div class="sys" id="sys" hidden>SYSTEM STANDBY</div>
          <h2 id="title" hidden>INIT</h2>
          <p id="desc" hidden>方向键 / WASD 导航<br>粉紫 +1 · 金色 +3 · 闪电即死</p>
          <button id="action" type="button">BOOT</button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <span>WASD · ARROWS · SPACE</span>
      <div class="badge">WRAP ON</div>
    </footer>

    <div class="pad" aria-hidden="true">
      <button class="up" data-dir="up" type="button">▲</button>
      <button class="left" data-dir="left" type="button">◀</button>
      <button class="pause" data-act="pause" type="button">II</button>
      <button class="right" data-dir="right" type="button">▶</button>
      <button class="down" data-dir="down" type="button">▼</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d", { alpha: false });
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const lenEl = document.getElementById("len");
    const spdEl = document.getElementById("spd");
    const overlay = document.getElementById("overlay");
    const titleEl = document.getElementById("title");
    const descEl = document.getElementById("desc");
    const sysEl = document.getElementById("sys");
    const actionBtn = document.getElementById("action");

    const GRID = 20;
    const VIEW = 480;
    const CELL = VIEW / GRID;
    const BASE = 128;
    const MIN = 62;
    const STORE = "q-snake-best";
    const MAX_PARTICLES = 48;

    const MOVE = {
      up: { x: 0, y: -1 },
      down: { x: 0, y: 1 },
      left: { x: -1, y: 0 },
      right: { x: 1, y: 0 },
    };
    const BACK = { up: "down", down: "up", left: "right", right: "left" };

    let snake = [];
    let fromSnake = [];
    let dir = "right";
    let prevDir = "right";
    let nextDir = "right";
    let food = { x: 14, y: 10, kind: "small" };
    let bolt = null;
    let boltNext = 0;
    let score = 0;
    let best = Number(localStorage.getItem(STORE)) || 0;
    let state = "idle";
    let moveStart = 0;
    let progress = 1;
    let speed = BASE;
    let particles = [];
    let floats = [];
    let rings = [];
    let portals = [];
    let biteBoost = 0;
    let shake = 0;
    let scanY = 0;
    let boardLayer = null;
    let rafId = 0;

    bestEl.textContent = pad(best);

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function copySnake(list) {
      return list.map((p) => ({ x: p.x, y: p.y }));
    }

    function setHud() {
      scoreEl.textContent = pad(score);
      bestEl.textContent = pad(best);
      lenEl.textContent = pad(snake.length || 3);
      spdEl.textContent = pad(Math.round((BASE - speed) / 4) + 1);
    }

    function reset() {
      snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 },
      ];
      fromSnake = copySnake(snake);
      dir = "right";
      prevDir = "right";
      nextDir = "right";
      score = 0;
      speed = BASE;
      progress = 1;
      particles = [];
      floats = [];
      rings = [];
      portals = [];
      biteBoost = 0;
      shake = 0;
      bolt = null;
      boltNext = performance.now() + 2800 + Math.random() * 2200;
      setHud();
      placeFood();
    }

    function burst(gx, gy, hue, points) {
      const cx = gx * CELL + CELL / 2;
      const cy = gy * CELL + CELL / 2;
      const now = performance.now();
      const big = points > 1;
      const colors = hue === "wrap"
        ? ["rgba(60,246,255,", "rgba(157,255,106,"]
        : big
          ? ["rgba(255,196,77,", "rgba(60,246,255,", "rgba(157,255,106,"]
          : ["rgba(255,60,173,", "rgba(60,246,255,", "rgba(255,196,77,"];
      const count = hue === "wrap" ? 6 : big ? 14 : 10;

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const power = 0.7 + Math.random() * (big ? 3.2 : 2.6);
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * power,
          vy: Math.sin(angle) * power,
          life: 1,
          decay: 0.02 + Math.random() * 0.03,
          size: 1.4 + Math.random() * (big ? 3.6 : 2.8),
          color: colors[i % colors.length],
        });
      }
      if (particles.length > MAX_PARTICLES) particles.splice(0, particles.length - MAX_PARTICLES);

      if (hue !== "wrap") {
        floats.push({
          x: cx,
          y: cy - 6,
          text: "+" + points,
          life: 1,
          born: now,
        });
        rings.push({ x: cx, y: cy, life: 1, born: now });
        biteBoost = big ? 1.35 : 1;
        shake = big ? 6 : 4;
        scoreEl.classList.remove("pop");
        void scoreEl.offsetWidth;
        scoreEl.classList.add("pop");
      }
    }

    function spawnPortal(from, to) {
      portals.push({
        x: from.x * CELL + CELL / 2,
        y: from.y * CELL + CELL / 2,
        life: 1,
      });
      portals.push({
        x: to.x * CELL + CELL / 2,
        y: to.y * CELL + CELL / 2,
        life: 1,
      });
    }

    function updateEffects() {
      let write = 0;
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.92;
        p.vy *= 0.92;
        p.life -= p.decay;
        if (p.life > 0) particles[write++] = p;
      }
      particles.length = write;

      write = 0;
      const now = performance.now();
      for (let i = 0; i < floats.length; i++) {
        const f = floats[i];
        f.life = 1 - (now - f.born) / 700;
        f.y -= 0.45;
        if (f.life > 0) floats[write++] = f;
      }
      floats.length = write;

      write = 0;
      for (let i = 0; i < rings.length; i++) {
        const r = rings[i];
        r.life = 1 - (now - r.born) / 520;
        if (r.life > 0) rings[write++] = r;
      }
      rings.length = write;

      write = 0;
      for (let i = 0; i < portals.length; i++) {
        const p = portals[i];
        p.life -= 0.035;
        if (p.life > 0) portals[write++] = p;
      }
      portals.length = write;

      if (biteBoost > 0) biteBoost = Math.max(0, biteBoost - 0.08);
      if (shake > 0.05) shake *= 0.78;
      else shake = 0;
      scanY = (scanY + 1.15) % VIEW;
    }

    function drawEffects() {
      for (let i = 0; i < rings.length; i++) {
        const r = rings[i];
        ctx.beginPath();
        ctx.arc(r.x, r.y, CELL * (0.25 + (1 - r.life) * 1.45), 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255, 60, 173, " + (r.life * 0.7) + ")";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      for (let i = 0; i < portals.length; i++) {
        const p = portals[i];
        ctx.beginPath();
        ctx.arc(p.x, p.y, CELL * (0.2 + (1 - p.life) * 0.9), 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(157, 255, 106, " + (p.life * 0.8) + ")";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        ctx.fillStyle = p.color + Math.max(0, p.life * 0.9) + ")";
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }

      if (floats.length) {
        ctx.font = "700 13px Orbitron, sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = "#9dff6a";
        for (let i = 0; i < floats.length; i++) {
          const f = floats[i];
          ctx.globalAlpha = Math.max(0, f.life);
          ctx.fillText(f.text, f.x, f.y);
        }
        ctx.globalAlpha = 1;
        ctx.textAlign = "start";
      }
    }

    function randomEmptyCell(extraBusy) {
      const busy = new Set(snake.map((p) => `${p.x},${p.y}`));
      busy.add(`${food.x},${food.y}`);
      if (bolt) busy.add(`${bolt.x},${bolt.y}`);
      if (extraBusy) {
        for (let i = 0; i < extraBusy.length; i++) busy.add(extraBusy[i]);
      }
      let spot;
      let guard = 0;
      do {
        spot = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID),
        };
        guard += 1;
      } while (busy.has(`${spot.x},${spot.y}`) && guard < 200);
      return spot;
    }

    function placeFood() {
      const spot = randomEmptyCell();
      food = {
        x: spot.x,
        y: spot.y,
        kind: Math.random() < 0.28 ? "big" : "small",
      };
    }

    function spawnBolt(now) {
      const spot = randomEmptyCell();
      bolt = {
        x: spot.x,
        y: spot.y,
        expire: now + 3200 + Math.random() * 2800,
      };
    }

    function updateBolt(now) {
      if (state !== "running") return;
      if (bolt) {
        if (now >= bolt.expire) {
          bolt = null;
          boltNext = now + 1800 + Math.random() * 3200;
        }
        return;
      }
      if (now >= boltNext) spawnBolt(now);
    }

    function turn(name) {
      if (!MOVE[name] || BACK[dir] === name) return;
      nextDir = name;
    }

    function show(sys, title, desc, label) {
      sysEl.hidden = false;
      titleEl.hidden = false;
      descEl.hidden = false;
      sysEl.textContent = sys;
      titleEl.textContent = title;
      descEl.innerHTML = desc;
      actionBtn.textContent = label;
      overlay.classList.remove("hidden");
    }

    function showBoot() {
      sysEl.hidden = true;
      titleEl.hidden = true;
      descEl.hidden = true;
      actionBtn.textContent = "BOOT";
      overlay.classList.remove("hidden");
    }

    function hide() {
      overlay.classList.add("hidden");
    }

    function die(reason) {
      state = "over";
      progress = 1;
      fromSnake = copySnake(snake);
      if (rafId) cancelAnimationFrame(rafId);
      rafId = 0;
      shake = reason === "bolt" ? 10 : 8;
      const tip = reason === "bolt"
        ? "误触闪电果实，电路烧毁"
        : "自身碰撞，相位通道关闭";
      show(
        reason === "bolt" ? "OVERLOAD" : "SIGNAL LOST",
        reason === "bolt" ? "ZAPPED" : "CRASH",
        `本局得分 <b>${pad(score)}</b><br>${tip}`,
        "REBOOT"
      );
    }

    function step() {
      prevDir = dir;
      dir = nextDir;
      const head = snake[0];
      const m = MOVE[dir];
      const raw = { x: head.x + m.x, y: head.y + m.y };
      const next = {
        x: (raw.x + GRID) % GRID,
        y: (raw.y + GRID) % GRID,
      };
      const wrapped = raw.x !== next.x || raw.y !== next.y;

      if (snake.some((p) => p.x === next.x && p.y === next.y)) {
        die();
        return false;
      }

      const prev = copySnake(snake);
      const hitBolt = !!(bolt && next.x === bolt.x && next.y === bolt.y);
      const hit = next.x === food.x && next.y === food.y;
      const grew = hit;
      snake = [next, ...prev];
      if (!grew) snake.pop();
      fromSnake = copySnake(prev);
      if (grew) fromSnake.push(prev[prev.length - 1]);

      if (wrapped) {
        spawnPortal(head, next);
        burst(next.x, next.y, "wrap");
      }

      if (hitBolt) {
        bolt = null;
        zapBurst(next.x, next.y);
        die("bolt");
        return false;
      }

      if (grew) {
        const points = food.kind === "big" ? 3 : 1;
        burst(next.x, next.y, "eat", points);
        score += points;
        speed = Math.max(MIN, BASE - score * 4);
        if (score > best) {
          best = score;
          localStorage.setItem(STORE, String(best));
        }
        setHud();
        placeFood();
      } else {
        setHud();
      }

      return true;
    }

    function wrapDelta(from, to) {
      let dx = to.x - from.x;
      let dy = to.y - from.y;
      if (dx > GRID / 2) dx -= GRID;
      if (dx < -GRID / 2) dx += GRID;
      if (dy > GRID / 2) dy -= GRID;
      if (dy < -GRID / 2) dy += GRID;
      return { dx, dy };
    }

    function lerpPos(from, to, t) {
      const { dx, dy } = wrapDelta(from, to);
      return { x: from.x + dx * t, y: from.y + dy * t };
    }

    function wrapPoint(p) {
      return {
        x: ((p.x % GRID) + GRID) % GRID,
        y: ((p.y % GRID) + GRID) % GRID,
      };
    }

    function near(a, b) {
      return Math.abs(a.x - b.x) < 1e-3 && Math.abs(a.y - b.y) < 1e-3;
    }

    function unwrapPath(parts) {
      if (!parts.length) return [];
      const out = [{ x: parts[0].x, y: parts[0].y }];
      for (let i = 1; i < parts.length; i++) {
        const prev = out[i - 1];
        const { dx, dy } = wrapDelta(prev, parts[i]);
        out.push({ x: prev.x + dx, y: prev.y + dy });
      }
      return out;
    }

    function getVisualParts(t) {
      if (!snake.length) return [];
      t = Math.min(1, Math.max(0, t));
      const from = fromSnake.length ? fromSnake : snake;
      const last = snake.length - 1;
      const pts = [lerpPos(from[0] || snake[0], snake[0], t)];

      for (let i = 1; i < snake.length; i++) {
        const p = { x: snake[i].x, y: snake[i].y };
        if (!near(pts[pts.length - 1], p)) pts.push(p);
      }

      const tail = lerpPos(from[from.length - 1] || snake[last], snake[last], t);
      if (!near(pts[pts.length - 1], tail)) pts.push(tail);

      return unwrapPath(pts);
    }

    function wrapOffsets(path) {
      const offsets = [{ x: 0, y: 0 }];
      let l = false, r = false, u = false, d = false;
      for (const p of path) {
        if (p.x < 0.55) l = true;
        if (p.x > GRID - 0.55) r = true;
        if (p.y < 0.55) u = true;
        if (p.y > GRID - 0.55) d = true;
      }
      if (l) offsets.push({ x: GRID, y: 0 });
      if (r) offsets.push({ x: -GRID, y: 0 });
      if (u) offsets.push({ x: 0, y: GRID });
      if (d) offsets.push({ x: 0, y: -GRID });
      if (l && u) offsets.push({ x: GRID, y: GRID });
      if (l && d) offsets.push({ x: GRID, y: -GRID });
      if (r && u) offsets.push({ x: -GRID, y: GRID });
      if (r && d) offsets.push({ x: -GRID, y: -GRID });
      return offsets;
    }

    function dirAngle(name) {
      if (name === "right") return 0;
      if (name === "down") return Math.PI / 2;
      if (name === "left") return Math.PI;
      return -Math.PI / 2;
    }

    function lerpAngle(a, b, t) {
      let d = b - a;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      return a + d * t;
    }

    function toScreen(p) {
      return { x: p.x * CELL + CELL / 2, y: p.y * CELL + CELL / 2 };
    }

    function makeBoardLayer() {
      const off = document.createElement("canvas");
      off.width = VIEW;
      off.height = VIEW;
      const o = off.getContext("2d");

      o.fillStyle = "#061018";
      o.fillRect(0, 0, VIEW, VIEW);

      const g = o.createRadialGradient(VIEW / 2, VIEW / 2, 40, VIEW / 2, VIEW / 2, VIEW * 0.72);
      g.addColorStop(0, "rgba(20, 70, 90, 0.22)");
      g.addColorStop(1, "rgba(0, 0, 0, 0.35)");
      o.fillStyle = g;
      o.fillRect(0, 0, VIEW, VIEW);

      o.lineWidth = 1;
      o.beginPath();
      for (let i = 0; i <= GRID; i++) {
        if (i % 5 === 0) continue;
        const p = i * CELL;
        o.moveTo(p, 0);
        o.lineTo(p, VIEW);
        o.moveTo(0, p);
        o.lineTo(VIEW, p);
      }
      o.strokeStyle = "rgba(60,246,255,0.05)";
      o.stroke();

      o.beginPath();
      for (let i = 0; i <= GRID; i += 5) {
        const p = i * CELL;
        o.moveTo(p, 0);
        o.lineTo(p, VIEW);
        o.moveTo(0, p);
        o.lineTo(VIEW, p);
      }
      o.strokeStyle = "rgba(60,246,255,0.13)";
      o.stroke();

      o.strokeStyle = "rgba(60,246,255,0.55)";
      o.lineWidth = 3;
      o.strokeRect(1.5, 1.5, VIEW - 3, VIEW - 3);
      o.strokeStyle = "rgba(255,60,173,0.28)";
      o.lineWidth = 1;
      o.setLineDash([6, 8]);
      o.strokeRect(6, 6, VIEW - 12, VIEW - 12);
      o.setLineDash([]);
      return off;
    }

    function drawBoard() {
      if (!boardLayer) boardLayer = makeBoardLayer();
      ctx.drawImage(boardLayer, 0, 0);
      ctx.fillStyle = "rgba(60,246,255,0.07)";
      ctx.fillRect(0, scanY, VIEW, 18);
      ctx.fillStyle = "rgba(60,246,255,0.22)";
      ctx.fillRect(0, scanY + 16, VIEW, 1.5);
    }

    function drawHex(x, y, r) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = Math.PI / 6 + i * Math.PI / 3;
        const px = x + Math.cos(a) * r;
        const py = y + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    function zapBurst(gx, gy) {
      const cx = gx * CELL + CELL / 2;
      const cy = gy * CELL + CELL / 2;
      const colors = ["rgba(255,244,120,", "rgba(60,246,255,", "rgba(255,255,255,"];
      for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        const power = 1.2 + Math.random() * 3.6;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * power,
          vy: Math.sin(angle) * power,
          life: 1,
          decay: 0.025 + Math.random() * 0.03,
          size: 1.5 + Math.random() * 3.5,
          color: colors[i % colors.length],
        });
      }
      if (particles.length > MAX_PARTICLES) particles.splice(0, particles.length - MAX_PARTICLES);
      rings.push({ x: cx, y: cy, life: 1, born: performance.now() });
      floats.push({ x: cx, y: cy - 8, text: "ZAP", life: 1, born: performance.now() });
    }

    function drawBoltIcon(scale) {
      const s = scale;
      ctx.beginPath();
      ctx.moveTo(-2 * s, -10 * s);
      ctx.lineTo(3 * s, -2 * s);
      ctx.lineTo(-1 * s, -1 * s);
      ctx.lineTo(2 * s, 10 * s);
      ctx.lineTo(-3 * s, 1 * s);
      ctx.lineTo(1 * s, 0);
      ctx.closePath();
    }

    function drawBolt() {
      if (!bolt) return;
      const cx = bolt.x * CELL + CELL / 2;
      const cy = bolt.y * CELL + CELL / 2;
      const t = performance.now() / 1000;
      const left = Math.max(0, bolt.expire - performance.now());
      const warn = left < 900 ? 0.55 + Math.sin(t * 28) * 0.45 : 0.75 + Math.sin(t * 14) * 0.25;
      const r = CELL * 0.36;

      ctx.beginPath();
      ctx.arc(cx, cy, r * 1.35, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 236, 90, " + (0.1 + warn * 0.08) + ")";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,244,120," + (0.65 * warn) + ")";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = "#fff7a8";
      ctx.strokeStyle = "#3cf6ff";
      ctx.lineWidth = 1.2;
      drawBoltIcon(CELL / 24);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawFood() {
      const cx = food.x * CELL + CELL / 2;
      const cy = food.y * CELL + CELL / 2;
      const t = performance.now() / 1000;
      const big = food.kind === "big";
      const pulse = 1 + Math.sin(t * (big ? 4.2 : 5.2)) * (big ? 0.1 : 0.08);
      const r = CELL * (big ? 0.46 : 0.28) * pulse;
      const fill = big ? "rgba(255, 196, 77, 0.28)" : "rgba(255, 60, 173, 0.22)";
      const stroke = big ? "#ffc44d" : "#ff3cad";
      const aura = big ? "rgba(255,196,77,0.14)" : "rgba(255,60,173,0.12)";

      ctx.beginPath();
      ctx.arc(cx, cy, r * 1.55, 0, Math.PI * 2);
      ctx.fillStyle = aura;
      ctx.fill();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(t * (big ? 0.9 : 1.4));
      drawHex(0, 0, r);
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = big ? 2.5 : 2;
      ctx.stroke();

      if (big) {
        drawHex(0, 0, r * 0.55);
        ctx.strokeStyle = "rgba(255,255,255,0.55)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(0, 0, r * (big ? 0.26 : 0.32), 0, Math.PI * 2);
      ctx.fillStyle = big ? "#fff4d6" : "#fff6fb";
      ctx.fill();
      ctx.restore();

      drawBolt();
    }

    function strokePath(pts, radius) {
      if (!pts.length) return;
      const s = pts.map(toScreen);
      ctx.beginPath();
      ctx.moveTo(s[0].x, s[0].y);
      if (s.length === 1) {
        ctx.lineTo(s[0].x + 0.01, s[0].y);
        ctx.stroke();
        return;
      }
      if (s.length === 2) {
        ctx.lineTo(s[1].x, s[1].y);
        ctx.stroke();
        return;
      }

      for (let i = 1; i < s.length - 1; i++) {
        const prev = s[i - 1];
        const curr = s[i];
        const next = s[i + 1];
        const d1 = Math.hypot(curr.x - prev.x, curr.y - prev.y);
        const d2 = Math.hypot(next.x - curr.x, next.y - curr.y);
        const rad = Math.min(radius, d1 * 0.5, d2 * 0.5);
        if (rad < 0.8) ctx.lineTo(curr.x, curr.y);
        else ctx.arcTo(curr.x, curr.y, next.x, next.y, rad);
      }
      ctx.lineTo(s[s.length - 1].x, s[s.length - 1].y);
      ctx.stroke();
    }

    function drawStrokeSegments(parts, width, color) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, VIEW, VIEW);
      ctx.clip();
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      const radius = CELL * 0.48;
      const offsets = wrapOffsets(parts);
      for (let i = 0; i < offsets.length; i++) {
        const off = offsets[i];
        const shifted = new Array(parts.length);
        for (let j = 0; j < parts.length; j++) {
          shifted[j] = { x: parts[j].x + off.x, y: parts[j].y + off.y };
        }
        strokePath(shifted, radius);
      }
      ctx.restore();
    }

    function drawHead(p) {
      if (!p) return;
      const points = [p];
      if (p.x < 0 || p.x >= GRID || p.y < 0 || p.y >= GRID) points.push(wrapPoint(p));
      const turnT = Math.min(1, Math.max(0, progress / 0.42));
      const rot = lerpAngle(dirAngle(prevDir), dirAngle(dir), turnT);

      for (let i = 0; i < points.length; i++) {
        const c = points[i];
        const s = toScreen(c);
        const boost = biteBoost * 4;
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(rot);

        ctx.fillStyle = "rgba(60,246,255,0.22)";
        ctx.beginPath();
        ctx.moveTo(CELL * 0.42 + boost, 0);
        ctx.lineTo(-CELL * 0.26, CELL * 0.34 + boost * 0.3);
        ctx.lineTo(-CELL * 0.26, -CELL * 0.34 - boost * 0.3);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#8ffbff";
        ctx.beginPath();
        ctx.moveTo(CELL * 0.38 + boost, 0);
        ctx.lineTo(-CELL * 0.22, CELL * 0.28 + boost * 0.3);
        ctx.lineTo(-CELL * 0.22, -CELL * 0.28 - boost * 0.3);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#041018";
        ctx.beginPath();
        ctx.arc(CELL * 0.08, -5, 2.3, 0, Math.PI * 2);
        ctx.arc(CELL * 0.08, 5, 2.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#9dff6a";
        ctx.beginPath();
        ctx.arc(CELL * 0.12, -5, 1.15, 0, Math.PI * 2);
        ctx.arc(CELL * 0.12, 5, 1.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawSnake() {
      const t = Math.min(1, Math.max(0, progress));
      const parts = getVisualParts(t);
      if (!parts.length) return;
      if (parts.length > 1) {
        drawStrokeSegments(parts, CELL * 0.78, "rgba(60,246,255,0.28)");
        drawStrokeSegments(parts, CELL * 0.52, "rgba(60,246,255,0.95)");
        drawStrokeSegments(parts, CELL * 0.18, "rgba(255,255,255,0.88)");
      }
      drawHead(parts[0]);
    }

    function draw() {
      ctx.save();
      if (shake > 0.4) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      }
      drawBoard();
      drawFood();
      drawSnake();
      drawEffects();
      ctx.restore();
    }

    function start() {
      reset();
      state = "running";
      hide();
      moveStart = performance.now();
      progress = 0;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(loop);
    }

    function pause() {
      if (state !== "running") return;
      state = "paused";
      if (rafId) cancelAnimationFrame(rafId);
      rafId = 0;
      show("PROCESS HALTED", "PAUSE", "空格继续运行", "RESUME");
    }

    function resume() {
      if (state !== "paused") return;
      state = "running";
      hide();
      moveStart = performance.now() - progress * speed;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(loop);
    }

    function loop(t) {
      if (state !== "running") return;
      progress = (t - moveStart) / speed;
      if (progress >= 1) {
        const ok = step();
        if (!ok) {
          draw();
          rafId = 0;
          return;
        }
        moveStart = t;
        progress = 0;
      }
      updateEffects();
      updateBolt(t);
      draw();
      rafId = requestAnimationFrame(loop);
    }

    actionBtn.addEventListener("click", () => {
      if (state === "paused") resume();
      else start();
    });

    document.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (k === " " || k === "spacebar") {
        e.preventDefault();
        if (state === "idle" || state === "over") start();
        else if (state === "running") pause();
        else if (state === "paused") resume();
        return;
      }
      if (state !== "running") return;
      if (["arrowup", "w"].includes(k)) { e.preventDefault(); turn("up"); }
      else if (["arrowdown", "s"].includes(k)) { e.preventDefault(); turn("down"); }
      else if (["arrowleft", "a"].includes(k)) { e.preventDefault(); turn("left"); }
      else if (["arrowright", "d"].includes(k)) { e.preventDefault(); turn("right"); }
    });

    document.querySelector(".pad").addEventListener("pointerdown", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      e.preventDefault();
      if (btn.dataset.act === "pause") {
        if (state === "idle" || state === "over") start();
        else if (state === "running") pause();
        else if (state === "paused") resume();
        return;
      }
      if (state === "idle" || state === "over") start();
      if (state === "running" && btn.dataset.dir) turn(btn.dataset.dir);
    });

    let swipe = null;
    canvas.addEventListener("pointerdown", (e) => {
      swipe = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener("pointerup", (e) => {
      if (!swipe) return;
      const dx = e.clientX - swipe.x;
      const dy = e.clientY - swipe.y;
      swipe = null;
      if (Math.hypot(dx, dy) < 24) return;
      if (state === "idle" || state === "over") start();
      if (state !== "running") return;
      if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? "right" : "left");
      else turn(dy > 0 ? "down" : "up");
    });

    reset();
    draw();
  </script>
</body>
</html>
